# =============================================================================
# AI Knowledge Assistant — Hot-Reload Docker Compose Stack
# =============================================================================
# Uses dedicated ports 8001 (Backend) and 5174 (Frontend) so it runs side-by-side
# with NewsLens-AI (8000 / 5173) without any port conflicts.
# =============================================================================

services:
  backend:
    image: ai-knowledge-assistant-backend:latest
    container_name: ai-knowledge-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      # Persistent storage (ChromaDB, uploaded files, HuggingFace model weights)
      - ./data:/app/data
      # Live code & config bind mounts — edits on Mac reflect immediately without rebuilds
      - ./backend:/app/backend
      - ./core:/app/core
      - ./.env:/app/.env:ro
      - ./Sample_doc:/app/Sample_doc:ro
    env_file:
      - .env
    environment:
      - RUNNING_IN_DOCKER=true
      - HF_HOME=/app/data/hf_cache
      - TOKENIZERS_PARALLELISM=false
      - OMP_NUM_THREADS=4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ai-knowledge-assistant-frontend:latest
    container_name: ai-knowledge-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5174}:5174"
    volumes:
      # Mount entire frontend directory for live HMR while keeping container's node_modules isolated
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8001}
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      backend:
        condition: service_started

volumes:
  frontend_node_modules:
    driver: local