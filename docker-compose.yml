# docker-compose.yml
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      # Persist ChromaDB, uploads, and HuggingFace model cache on host
      - ./data:/app/data
      # Live code sync for instant local updates on macOS without image rebuilds
      - ./backend:/app/backend
      - ./core:/app/core
      - ./Sample_doc:/app/Sample_doc:ro
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - HF_HOME=/app/data/hf_cache
      - TOKENIZERS_PARALLELISM=false
      - OMP_NUM_THREADS=4
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      # Live HMR sync for frontend development on macOS
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend